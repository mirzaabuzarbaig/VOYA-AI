# ═══════════════════════════════════════════════════════════════
# VoyaAI Backend — Spring Boot & PostgreSQL Configuration
# ═══════════════════════════════════════════════════════════════

spring.application.name=voyaai-backend
server.port=8080
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Connection via Environment Variables (with developer fallbacks)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/voyaai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Jackson JSON Settings
# (Default ISO-8601 formatting for LocalDateTime)

# Logging
logging.level.com.voyaai=DEBUG
logging.level.org.springframework.web=INFO

# JWT signing key must be provided as a Base64 encoded environment variable with at least 32 random bytes.
# A default 256-bit key is provided for local development fallback
jwt.secret=${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci12b3lhYWktZGV2ZWxvcG1lbnQtMjU2Yml0cw==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# External Travel APIs Configuration
# Optional: OpenWeatherMap API key (if blank, Open-Meteo keyless provider is used)
travel.weather.api-key=${WEATHER_API_KEY:}
# Optional: Geoapify API key (if blank, Wikimedia official Places provider is used)
travel.places.api-key=${PLACES_API_KEY:}
# API Client timeouts in milliseconds
travel.connect-timeout-ms=${TRAVEL_CONNECT_TIMEOUT_MS:5000}
travel.read-timeout-ms=${TRAVEL_READ_TIMEOUT_MS:8000}

# AI Itinerary Generation Provider Configuration
# Supported providers: "gemini" or "openai"
ai.provider=${AI_PROVIDER:gemini}
ai.gemini.api-key=${GEMINI_API_KEY:${AI_API_KEY:}}
ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
ai.openai.api-key=${OPENAI_API_KEY:${AI_API_KEY:}}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
ai.timeout-ms=${AI_TIMEOUT_MS:35000}

# Python FastAPI ML Cost Prediction Service Configuration
ml.service.base-url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.timeout-ms=${ML_TIMEOUT_MS:10000}

